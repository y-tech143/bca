<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCA Hub — Notes, PYQs, Syllabus & Assignments</title>
<meta name="description" content="Free BCA semester-wise notes, previous year question papers, solved assignments, practicals and syllabus in one modern dashboard.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1SEUrloEFO0AP9w7qxTsjKRbCY-j4YPZE">
<script>
    // Applied before the stylesheet paints anything, so there's no flash of the wrong theme
    (function () {
        try {
            var saved = localStorage.getItem('bcaHubTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
    })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<!-- GSAP powers only the hero stagger-reveal; every other motion (reveals, tilt,
     magnetic buttons, cursor, marquee) is vanilla JS so nothing depends on it loading. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<!-- ============ PRELOADER ============ -->
<div id="preloader" aria-hidden="true">
    <span class="preloader-mark">BCA<span class="gradient-text">HUB</span></span>
    <span class="preloader-count" id="preloaderCount">0</span>
</div>

<!-- ============ CUSTOM CURSOR ============ -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"><span id="cursorLabel"></span></div>

<!-- ============ AMBIENT BACKGROUND ============ -->
<div class="mesh-bg" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
</div>

<!-- ============ NAVBAR ============ -->
<header class="navbar glass">
    <div class="nav-inner">
        <a href="#" class="nav-logo" onclick="renderHomeDashboard(); return false;" data-cursor-label="Home">
            BCA<span class="gradient-text">HUB</span>
        </a>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="liveSearchInput" placeholder="Search notes, PYQs, subjects... (Ctrl+K)">
        </div>

        <nav class="nav-links" aria-label="Primary">
            <a href="#" onclick="renderHomeDashboard(); return false;" class="magnetic" data-cursor-label="">Semesters</a>
            <a href="#" onclick="scrollToNotices(); return false;" class="magnetic" data-cursor-label="">Notices</a>
        </nav>

        

        <button id="themeToggle" class="circle-btn" title="Toggle theme" aria-label="Toggle dark or light theme">
            <i class="fa-solid fa-moon"></i>
        </button>

        <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span>
        </button>
    </div>
    <div class="nav-mobile" id="navMobile">
        <a href="#" onclick="renderHomeDashboard(); document.getElementById('navMobile').classList.remove('open'); return false;">Semesters</a>
        <a href="#" onclick="scrollToNotices(); document.getElementById('navMobile').classList.remove('open'); return false;">Notices</a>
        <button class="btn-glow" onclick="openAiAssistantView()"><i class="fa-solid fa-robot"></i><span>Ask AI</span></button>
        <button id="themeToggleMobile" class="btn-ghost"><i class="fa-solid fa-moon"></i> <span>Toggle theme</span></button>
    </div>
</header>

<!-- ============ LIVE NOTICE TICKER (persistent, thin, always visible) ============ -->
<div class="ticker glass" id="tickerBar">
    <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="main-wrapper">
    <div id="dynamicContentContext"></div>
</div>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
    <div class="footer-inner">
        <span class="footer-logo">BCA<span class="gradient-text">HUB</span></span>
        <div class="footer-time">
            <i class="fa-regular fa-clock"></i>
            <span id="footerTime">--:--</span>
            <span class="footer-time-label">Your local time</span>
        </div>
        <div class="footer-socials">
            <a href="https://chat.whatsapp.com/IGVGUkdRXvYLSB594flU1n" target="_blank" class="social-glow magnetic" aria-label="WhatsApp Group"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://erp.univraj.org/" target="_blank" class="social-glow magnetic" aria-label="University Exam Portal"><i class="fa-solid fa-graduation-cap"></i></a>
        </div>
    </div>
    <p class="footer-copy">
        © <span id="footerYear"></span> BCA Hub. Developed <i class="fa-solid fa-heart neon-heart"></i> by <span class="yash-name">YASH</span>
    </p>
    <p class="footer-copy footer-blessing">।। श्री राधा रमणों विजयते ।।</p>
</footer>

<button id="backToTop" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>
<div id="toastContainer" aria-live="polite"></div>

<!-- ============ FILE PREVIEW MODAL ============ -->
<div class="modal-overlay" id="premiumFileModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel glass">
        <div class="modal-header">
            <span id="modalFileTitle">Document Viewer</span>
            <button onclick="closePremiumModal()" class="modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <iframe id="modalIframeViewer" src="" width="100%" height="100%" frameborder="0"></iframe>
    </div>
</div>

<script src="admin-data.js"></script>
</body>
</html>
